<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission GN — Le laboratoire des transformations</title>
<style>
:root{--bg:#eff6ff;--ink:#17324d;--muted:#58708d;--primary:#635bdf;--cyan:#16abc1;--good:#087f5b;--bad:#c43e51;--card:#fff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 5%,#d9f7f1 0,transparent 35%),radial-gradient(circle at 90% 5%,#e9e1ff 0,transparent 35%),var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh}.shell{max-width:1000px;margin:auto;padding:24px 16px 48px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:25px}.logo{font-weight:900;font-size:clamp(1.35rem,3vw,2rem)}.logo span{color:var(--primary)}.pill{border-radius:999px;padding:9px 14px;background:white;box-shadow:0 5px 20px #20376612;font-weight:700}.hero{text-align:center;margin:12px auto 26px;max-width:750px}.hero h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.12;margin:5px 0 10px}.hero p{font-size:1.08rem;color:var(--muted)}.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.level{border:2px solid #e0e8f3;background:#fff;border-radius:22px;padding:20px 15px;text-align:left;cursor:pointer;transition:.15s;box-shadow:0 6px 15px #2037660a;color:inherit;min-height:185px}.level:hover,.level:focus-visible{border-color:var(--primary);transform:translateY(-3px);outline:none}.level strong{display:block;font-size:1.1rem;margin:9px 0}.level small{color:var(--muted);line-height:1.5;display:block;font-size:.85rem}.emoji{font-size:2rem}.card{background:var(--card);padding:clamp(20px,4vw,38px);border-radius:28px;box-shadow:0 12px 35px #183b6018}.hidden{display:none!important}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.button{font:inherit;cursor:pointer;border:0;border-radius:15px;padding:14px 19px;background:var(--primary);color:white;font-weight:800}.button:hover{filter:brightness(1.08)}.button.secondary{background:#eaf0fa;color:var(--ink)}.button:disabled{opacity:.48;cursor:not-allowed}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#f0f4fc;border-radius:12px;padding:9px 13px;font-size:.9rem;font-weight:800}.track{height:12px;background:#e8edf7;border-radius:99px;overflow:hidden;margin:22px 0 26px}.fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--primary));width:0;transition:width .3s}.prompt{text-align:center}.label{color:var(--muted);font-size:.93rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase}.phrase{font-size:clamp(1.65rem,4vw,2.7rem);font-weight:900;margin:12px 0 15px;overflow-wrap:anywhere}.conversion{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 25px}.chip{background:#e9e8ff;color:#3f38a3;padding:10px 13px;border-radius:12px;font-weight:800}.arrow{font-size:1.7rem;color:var(--cyan)}.answerwrap{max-width:570px;margin:auto}label[for=answer]{display:block;font-weight:800;margin-bottom:8px}input{width:100%;padding:17px 16px;border:2px solid #bdcbde;border-radius:15px;font:inherit;font-size:1.25rem;color:var(--ink);outline:none}input:focus{border-color:var(--primary);box-shadow:0 0 0 4px #635bdf22}.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.actions .button{flex:1}.feedback{margin:20px auto 0;max-width:570px;border-radius:17px;padding:15px 19px;line-height:1.5}.feedback.good{background:#e2f8ed;border:1px solid #a2e5c6}.feedback.bad{background:#fff0f1;border:1px solid #f7c9d0}.feedback strong{display:block;font-size:1.06rem}.hint{margin:15px auto 0;max-width:570px;background:#f4f3ff;border-radius:14px;padding:12px 15px;color:#433e82}.result{text-align:center}.result .trophy{font-size:4rem}.result h2{font-size:2rem}.result p{color:var(--muted)}.result .actions{justify-content:center}.result .actions .button{flex:0 1 auto}.footer{text-align:center;color:var(--muted);margin-top:26px;font-size:.88rem}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:750px){.levels{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:430px){.levels{grid-template-columns:1fr}.level{min-height:auto}.shell{padding:16px 12px 35px}header{align-items:flex-start}.stat{font-size:.78rem}.actions{flex-direction:column}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell"><header><div class="logo">🚀 Mission <span>GN</span></div><div class="pill" id="headerScore">⭐ Prêt à jouer ?</div></header>
<main>
<section id="home"><div class="hero"><h1>Le laboratoire des transformations 🧪</h1><p>Transforme les groupes nominaux au <strong>masculin</strong>, au <strong>féminin</strong>, au <strong>singulier</strong> ou au <strong>pluriel</strong>. Choisis ta mission !</p></div><div class="levels" id="levels"></div><p class="footer">✨ 10 défis par mission · Consignes variées · On apprend en s'amusant !</p></section>
<section id="game" class="card hidden" aria-label="Exercice"><div class="topline"><button id="back" class="button secondary" type="button">← Missions</button><div class="stats"><div class="stat" id="levelTag"></div><div class="stat" id="progressTag"></div><div class="stat" id="pointsTag"></div></div></div><div class="track" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="track"><div class="fill" id="fill"></div></div><div class="prompt"><div class="label">Transforme ce groupe nominal</div><div class="phrase" id="source"></div><div class="conversion"><span class="chip" id="from"></span><span class="arrow">➜</span><span class="chip" id="to"></span></div></div><div class="answerwrap"><form id="answerForm" autocomplete="off"><label for="answer">Ta réponse :</label><input id="answer" type="text" placeholder="Écris le groupe nominal…" spellcheck="false" autocapitalize="none" maxlength="120" required><div class="actions"><button class="button" id="validate" type="submit">Vérifier ✓</button><button class="button secondary" id="next" type="button" hidden>Défi suivant →</button></div></form><div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div><div id="hint" class="hint hidden"></div></div></section>
<section id="result" class="card result hidden"><div class="trophy" id="trophy">🏆</div><h2 id="resultTitle"></h2><p id="resultText"></p><div class="actions"><button id="replay" class="button" type="button">Rejouer ce niveau 🔁</button><button id="choose" class="button secondary" type="button">Choisir une mission</button></div></section>
</main></div>
<script>
'use strict';
// Toutes les formes sont définies explicitement : aucune règle automatique ne crée de fautes.
const MS='masculin singulier',MP='masculin pluriel',FS='féminin singulier',FP='féminin pluriel';
const forms=[MS,MP,FS,FP];
// Ordre : masculin singulier, masculin pluriel, féminin singulier, féminin pluriel.
const levelData=[
{title:'Apprenti',emoji:'🌱',subtitle:'Articles et noms faciles',tip:'Pense à changer le déterminant et, si nécessaire, à ajouter ou enlever le s.',items:[
['un ami','des amis','une amie','des amies'],['le voisin','les voisins','la voisine','les voisines'],['un élève','des élèves','une élève','des élèves'],['le client','les clients','la cliente','les clientes'],['un cousin','des cousins','une cousine','des cousines'],['le marchand','les marchands','la marchande','les marchandes'],['un invité','des invités','une invitée','des invitées'],['le lapin','les lapins','la lapine','les lapines'],['un enfant','des enfants','une enfant','des enfants'],['le Français','les Français','la Française','les Françaises'],['un ami sportif','des amis sportifs','une amie sportive','des amies sportives'],['un petit voisin','des petits voisins','une petite voisine','des petites voisines'] ]},
{title:'Explorateur',emoji:'🧭',subtitle:'Adjectifs à accorder',tip:'Dans un groupe nominal, le déterminant, le nom et l’adjectif doivent s’accorder.',items:[
['un petit chat','des petits chats','une petite chatte','des petites chattes'],['le grand ami','les grands amis','la grande amie','les grandes amies'],['un voisin poli','des voisins polis','une voisine polie','des voisines polies'],['le cousin content','les cousins contents','la cousine contente','les cousines contentes'],['un enfant calme','des enfants calmes','une enfant calme','des enfants calmes'],['un élève prudent','des élèves prudents','une élève prudente','des élèves prudentes'],['le lapin blanc','les lapins blancs','la lapine blanche','les lapines blanches'],['un petit invité','des petits invités','une petite invitée','des petites invitées'],['un ami amusant','des amis amusants','une amie amusante','des amies amusantes'],['le marchand gentil','les marchands gentils','la marchande gentille','les marchandes gentilles'],['un client fidèle','des clients fidèles','une cliente fidèle','des clientes fidèles'] ]},
{title:'Champion',emoji:'⚡',subtitle:'Accords plus difficiles',tip:'Observe aussi les changements comme -eux → -euse, -if → -ive et -er → -ère.',items:[
['un garçon heureux','des garçons heureux','une fille heureuse','des filles heureuses'],['un acteur créatif','des acteurs créatifs','une actrice créative','des actrices créatives'],['le boulanger fier','les boulangers fiers','la boulangère fière','les boulangères fières'],['un sportif courageux','des sportifs courageux','une sportive courageuse','des sportives courageuses'],['le directeur attentif','les directeurs attentifs','la directrice attentive','les directrices attentives'],['un chanteur joyeux','des chanteurs joyeux','une chanteuse joyeuse','des chanteuses joyeuses'],['un infirmier sérieux','des infirmiers sérieux','une infirmière sérieuse','des infirmières sérieuses'],['le premier invité','les premiers invités','la première invitée','les premières invitées'],['un vendeur actif','des vendeurs actifs','une vendeuse active','des vendeuses actives'],['le dernier voisin','les derniers voisins','la dernière voisine','les dernières voisines'],['un danseur léger','des danseurs légers','une danseuse légère','des danseuses légères'] ]},
{title:'Expert',emoji:'🏆',subtitle:'Pluriels irréguliers',tip:'Attention aux pluriels particuliers : -eau → -eaux, -al → -aux et certains mots en -x ou -s.',items:[
['un beau cheval','de beaux chevaux','une belle jument','de belles juments'],['un vieux monsieur','de vieux messieurs','une vieille dame','de vieilles dames'],['un nouvel acteur','de nouveaux acteurs','une nouvelle actrice','de nouvelles actrices'],['un beau sportif','de beaux sportifs','une belle sportive','de belles sportives'],['un jeune héros','de jeunes héros','une jeune héroïne','de jeunes héroïnes'],['un travailleur heureux','des travailleurs heureux','une travailleuse heureuse','des travailleuses heureuses'],['un bel invité','de beaux invités','une belle invitée','de belles invitées'],['un vieux loup','de vieux loups','une vieille louve','de vieilles louves'],['un époux jaloux','des époux jaloux','une épouse jalouse','des épouses jalouses'],['un roi généreux','des rois généreux','une reine généreuse','des reines généreuses'],['un beau danseur','de beaux danseurs','une belle danseuse','de belles danseuses'] ]}
];
const $=id=>document.getElementById(id);let state=null;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b}
function makeTasks(level){const tasks=[];for(const entry of shuffle(levelData[level].items)){const pairs=[];for(let from=0;from<4;from++)for(let to=0;to<4;to++)if(from!==to)pairs.push({entry,from,to});const p=shuffle(pairs)[0];tasks.push(p)}return shuffle(tasks).slice(0,10)}
function clean(s){return s.normalize('NFC').trim().toLocaleLowerCase('fr').replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/[.!?]+$/,'')}
function show(id){['home','game','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function home(){state=null;$('headerScore').textContent='⭐ Prêt à jouer ?';show('home')}
function start(level){state={level,tasks:makeTasks(level),index:0,points:0,checked:false};show('game');render()}
function render(){const s=state,t=s.tasks[s.index];s.checked=false;$('source').textContent=t.entry[t.from];$('from').textContent=forms[t.from];$('to').textContent=forms[t.to];$('levelTag').textContent=levelData[s.level].emoji+' Niveau '+(s.level+1);$('progressTag').textContent='🎯 '+(s.index+1)+'/10';$('pointsTag').textContent='⭐ '+s.points;$('headerScore').textContent='⭐ '+s.points+' points';$('fill').style.width=(s.index/10*100)+'%';$('track').setAttribute('aria-valuenow',String(s.index));$('answer').value='';$('answer').disabled=false;$('validate').hidden=false;$('next').hidden=true;$('feedback').className='feedback hidden';$('feedback').textContent='';$('hint').classList.add('hidden');$('answer').focus()}
function check(e){e.preventDefault();if(!state||state.checked)return;const s=state,t=s.tasks[s.index],expected=t.entry[t.to],given=$('answer').value;if(!given.trim())return;const correct=clean(given)===clean(expected);s.checked=true;if(correct)s.points+=10;$('feedback').className='feedback '+(correct?'good':'bad');$('feedback').replaceChildren();const strong=document.createElement('strong');strong.textContent=correct?'🎉 Bravo ! Bonne réponse.':'💡 Bien essayé !';const msg=document.createElement('span');msg.textContent=correct?' Tu remportes 10 points.':' La bonne réponse est : « '+expected+' ». ';$('feedback').append(strong,msg);if(!correct){$('hint').textContent='Astuce : '+levelData[s.level].tip;$('hint').classList.remove('hidden')}$('answer').disabled=true;$('validate').hidden=true;$('next').hidden=false;$('next').textContent=s.index===9?'Voir mon résultat 🏆':'Défi suivant →';$('pointsTag').textContent='⭐ '+s.points;$('headerScore').textContent='⭐ '+s.points+' points';$('next').focus()}
function next(){if(!state||!state.checked)return;state.index++;if(state.index>=10){finish()}else render()}
function finish(){const s=state;$('fill').style.width='100%';$('track').setAttribute('aria-valuenow','10');$('trophy').textContent=s.points===100?'🏆':s.points>=70?'🌟':'💪';$('resultTitle').textContent=s.points===100?'Mission parfaite !':s.points>=70?'Super mission !':'Tu progresses !';$('resultText').textContent='Tu as gagné '+s.points+' points sur 100 au niveau « '+levelData[s.level].title+' ». '+(s.points<100?'Rejoue pour améliorer ton score !':'Tu peux tenter une autre mission !');show('result')}
for(let i=0;i<levelData.length;i++){const data=levelData[i],btn=document.createElement('button');btn.className='level';btn.type='button';btn.innerHTML='<span class="emoji" aria-hidden="true">'+data.emoji+'</span><strong>Niveau '+(i+1)+' · '+data.title+'</strong><small>'+data.subtitle+'</small>';btn.addEventListener('click',()=>start(i));$('levels').append(btn)}
$('answerForm').addEventListener('submit',check);$('next').addEventListener('click',next);$('back').addEventListener('click',home);$('choose').addEventListener('click',home);$('replay').addEventListener('click',()=>start(state.level));
</script></body></html>
